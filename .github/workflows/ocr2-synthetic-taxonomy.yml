          tests/test_region_review_keyboard.py
          tests/test_review_identity.py
          tests/test_review_ledger.py
          tests/test_review_ui.py
          tests/test_security_gate.py
          tests/test_semantic_failure_warning.py
          tests/test_semantic_proposals.py
          tests/test_server_idle_connection.py
          tests/test_synthetic_exporter.py
          tests/test_synthetic_fixed_engine.py
          tests/test_synthetic_ocr_metrics.py
          tests/test_tax_exact_arithmetic.py
          tests/test_tiff_offset_fixture.py
          tests/test_validation_rules.py

  windows-contracts:
    # DEC-011: the same modules on Windows, where the DPAPI archive, launcher
    # and Windows-specific paths run for real.
    name: Windows application contracts
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
