name: OCR2 synthetic taxonomy

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every application test module is listed explicitly (no discovery);
# application/tests/test_ci_workflow.py fails when a module is missing here.
jobs:
  taxonomy-contract:
    # The job name is the required status check on main: do not rename it.
    name: Taxonomy registry and binding
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"

      - name: Install the locked JSON Schema runtime
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          -r requirements/ci-taxonomy-cp313-ubuntu-24_04.lock

      - name: Install the locked pytest runtime
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          -r requirements/ci-pytest-cp313-ubuntu-24_04.lock

      - name: Install the locked decoder runtime
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: --require-hashes
          -r requirements/ci-decoder-cp313-ubuntu-24_04.lock

      - name: Run synthetic taxonomy contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
        run: >-
          python -B -m unittest -v
          test_taxonomy_registry
          test_taxonomy_binding

      - name: Run every synthetic application test module
        working-directory: application
        env:
          PYTHONPATH: ${{ github.workspace }}/application/src:${{ github.workspace }}/application/tests
        run: >-
          python -B -m pytest -q -rs -p no:cacheprovider
          tests/test_analysis_pipeline.py
          tests/test_app_instance.py
          tests/test_app_lifetime.py
          tests/test_build_payload.py
          tests/test_install_state.py
          tests/test_nsis_script.py
          tests/test_sbom_and_notices.py
          tests/test_app_window.py
          tests/test_app_window_routes.py
          tests/test_archive_backup.py
          tests/test_attached_currency_amounts.py
          tests/test_case_benchmark_fixtures.py
          tests/test_case_benchmark_score.py
          tests/test_case_export_reader.py
          tests/test_catalog_alias_delimiters.py
          tests/test_catalog_editor.py
          tests/test_catalog_pipeline.py
          tests/test_chatgpt_handoff.py
          tests/test_ci_workflow.py
          tests/test_contract_baseline.py
          tests/test_deletion_traces.py
          tests/test_document_contract.py
          tests/test_document_decoder.py
          tests/test_document_decoder_contract.py
          tests/test_document_export.py
          tests/test_document_family_catalog.py
          tests/test_document_library.py
          tests/test_document_processing.py
          tests/test_document_validation.py
          tests/test_evidence_linked_review_ui.py
          tests/test_expense_case_intake_routes.py
          tests/test_expense_case_processing.py
          tests/test_expense_case_store.py
          tests/test_expense_line_extraction.py
          tests/test_expense_reconciliation.py
          tests/test_expense_reconciliation_ui.py
          tests/test_expense_report_intake_session.py
          tests/test_expense_reports.py
          tests/test_exporter_registry.py
          tests/test_field_benchmark.py
          tests/test_field_status.py
          tests/test_field_status_presentation.py
          tests/test_fingerprints.py
          tests/test_gif_bmp_formats.py
          tests/test_handoff_latest_correction.py
          tests/test_hashed_lock.py
          tests/test_ingestion.py
          tests/test_interrupted_writes.py
          tests/test_invoice_line_items.py
          tests/test_isolated_decoder.py
          tests/test_library_ui.py
          tests/test_line_item_benchmark.py
          tests/test_local_document_archive_ui.py
          tests/test_local_document_store.py
          tests/test_local_intake_app.py
          tests/test_local_launcher.py
          tests/test_runtime_manifest.py
          tests/test_loopback_csrf.py
          tests/test_manual_chatgpt_handoff_ui.py
          tests/test_manual_region_review.py
          tests/test_materialized_upload_batch.py
          tests/test_merchant_name.py
          tests/test_multipage_tiff_processing_contract.py
          tests/test_ocr_adapter.py
          tests/test_ocr_engine_registry.py
          tests/test_ocr_job_ui.py
          tests/test_ocr_launcher_contract.py
          tests/test_ocr_processing.py
          tests/test_paddle_adapter.py
          tests/test_page_orientation.py
          tests/test_pdf_text_layer.py
          tests/test_preview_isolation.py
          tests/test_public_data_guard.py
          tests/test_rapidocr_adapter.py
